name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install system test dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libdbus-1-dev libasound2-dev pkg-config php-cli shellcheck

      - name: Verify release versions
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          web_version="$(node -p "require('./webapp/package.json').version")"
          server_version="$(node -p "require('./server/version.json').version")"
          test "$release_version" = "$cargo_version"
          test "$release_version" = "$web_version"
          test "$release_version" = "$server_version"

      - name: Test Rust application
        run: cargo test --locked --all-targets -- --test-threads=1

      - name: Test and build web application
        working-directory: webapp
        run: |
          npm ci
          npm test
          npm run build

      - name: Validate PHP and shell scripts
        shell: bash
        run: |
          find server webapp/api scripts -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          shellcheck scripts/*.sh

  build:
    name: Build ${{ matrix.artifact }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: questline-linux-x86_64
            binary: questline

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: questline-linux-aarch64
            binary: questline

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: questline-windows-x86_64.exe
            binary: questline.exe

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: questline-macos-x86_64
            binary: questline

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: questline-macos-arm64
            binary: questline

    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain de Rust con el target correcto
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache de Cargo para no recompilar dependencias en cada run
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Instalar dependencias de sistema para Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libdbus-1-dev libasound2-dev pkg-config

      - name: Compilar
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Copiar binario con el nombre final (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.artifact }}

      - name: Copiar binario con el nombre final (Windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.artifact }}
        shell: bash

      - name: Subir artefacto para que el job de release lo tome
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Publicar Release en GitHub
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Bajar todos los artefactos compilados
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Crear release y adjuntar binarios
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            questline-linux-x86_64
            questline-linux-aarch64
            questline-windows-x86_64.exe
            questline-macos-x86_64
            questline-macos-arm64
